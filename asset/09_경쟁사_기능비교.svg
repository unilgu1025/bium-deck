<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730">
  <defs>
    <style>
      text { font-family: "Pretendard", "Malgun Gothic", Arial, sans-serif; }
      .title { font-size: 28px; font-weight: 800; fill: #102A43; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #52616F; }
      .legend { font-size: 12px; font-weight: 600; fill: #52616F; }
      .headText { font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 600; fill: #263442; }
      .cellO { font-size: 16px; font-weight: 800; fill: #0D9488; text-anchor: middle; }
      .cellTri { font-size: 15px; font-weight: 800; fill: #B45309; text-anchor: middle; }
      .cellX { font-size: 16px; font-weight: 800; fill: #6B7280; text-anchor: middle; }
      .cellGoal { font-size: 11px; font-weight: 700; fill: #4F7CFF; text-anchor: middle; }
      .foot { font-size: 12px; font-weight: 500; fill: #52616F; }
      .grid { stroke: #E5EAF0; stroke-width: 1; }
      .border { stroke: #CBD5DF; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="730" rx="24" fill="#FFFFFF"/>
  <text x="35" y="55" class="title">BIUM 경쟁사 기능 비교</text>
  <text x="35" y="88" class="legend">O 기본 제공　△ 추가 구성·부분 제공　X 미제공　목표 BIUM 출시모델 개발목표　(전 제품 공통 보유 기능 4개는 제외: 원격 ON/OFF·예약 타이머·전력사용량 확인·셀프 설치)</text>

  <!-- table border & BIUM column band -->
  <rect x="35" y="110" width="1330" height="470" class="border"/>
  <rect x="1190" y="110" width="175" height="470" fill="#E8F7F4"/>

  <!-- header -->
  <rect x="35" y="110" width="1330" height="50" fill="#102A43"/>
  <rect x="1190" y="110" width="175" height="50" fill="#0D9488"/>
  <text x="402.5" y="140" class="headText">파워매니저</text>
  <text x="577.5" y="140" class="headText">헤이홈</text>
  <text x="752.5" y="140" class="headText">Tapo</text>
  <text x="927.5" y="140" class="headText">Aqara+Tapo</text>
  <text x="1102.5" y="140" class="headText">LG ThinQ ON</text>
  <text x="1277.5" y="140" class="headText">BIUM</text>

  <!-- vertical grid lines -->
  <line x1="315" y1="110" x2="315" y2="580" class="grid"/>
  <line x1="490" y1="110" x2="490" y2="580" class="grid"/>
  <line x1="665" y1="110" x2="665" y2="580" class="grid"/>
  <line x1="840" y1="110" x2="840" y2="580" class="grid"/>
  <line x1="1015" y1="110" x2="1015" y2="580" class="grid"/>
  <line x1="1190" y1="110" x2="1190" y2="580" class="grid"/>

  <!-- horizontal grid lines (after header + each of 10 rows) -->
  <line x1="35" y1="160" x2="1365" y2="160" class="grid"/>
  <line x1="35" y1="202" x2="1365" y2="202" class="grid"/>
  <line x1="35" y1="244" x2="1365" y2="244" class="grid"/>
  <line x1="35" y1="286" x2="1365" y2="286" class="grid"/>
  <line x1="35" y1="328" x2="1365" y2="328" class="grid"/>
  <line x1="35" y1="370" x2="1365" y2="370" class="grid"/>
  <line x1="35" y1="412" x2="1365" y2="412" class="grid"/>
  <line x1="35" y1="454" x2="1365" y2="454" class="grid"/>
  <line x1="35" y1="496" x2="1365" y2="496" class="grid"/>
  <line x1="35" y1="538" x2="1365" y2="538" class="grid"/>

  <!-- row 1: 예상 전기요금 확인 -->
  <text x="47" y="187" class="label">예상 전기요금 확인</text>
  <text x="402.5" y="187" class="cellO">O</text><text x="577.5" y="187" class="cellTri">△</text><text x="752.5" y="187" class="cellO">O</text><text x="927.5" y="187" class="cellO">O</text><text x="1102.5" y="187" class="cellTri">△</text><text x="1277.5" y="187" class="cellO">O</text>

  <!-- row 2: 콘센트별 독립제어 -->
  <text x="47" y="229" class="label">콘센트별 독립제어</text>
  <text x="402.5" y="229" class="cellTri">△</text><text x="577.5" y="229" class="cellO">O¹</text><text x="752.5" y="229" class="cellO">O¹</text><text x="927.5" y="229" class="cellO">O¹</text><text x="1102.5" y="229" class="cellO">O¹</text><text x="1277.5" y="229" class="cellO">O</text>

  <!-- row 3: 공간별 재실 판단 -->
  <text x="47" y="271" class="label">공간별 재실 판단</text>
  <text x="402.5" y="271" class="cellX">X</text><text x="577.5" y="271" class="cellX">X</text><text x="752.5" y="271" class="cellX">X</text><text x="927.5" y="271" class="cellO">O</text><text x="1102.5" y="271" class="cellTri">△²</text><text x="1277.5" y="271" class="cellO">O</text>

  <!-- row 4: 빈 공간 자동제어 -->
  <text x="47" y="313" class="label">빈 공간 자동제어</text>
  <text x="402.5" y="313" class="cellX">X</text><text x="577.5" y="313" class="cellX">X</text><text x="752.5" y="313" class="cellX">X</text><text x="927.5" y="313" class="cellTri">△³</text><text x="1102.5" y="313" class="cellTri">△³</text><text x="1277.5" y="313" class="cellO">O</text>

  <!-- row 5: 로컬 허브 자동판단 -->
  <text x="47" y="355" class="label">로컬 허브 자동판단</text>
  <text x="402.5" y="355" class="cellX">X</text><text x="577.5" y="355" class="cellX">X</text><text x="752.5" y="355" class="cellTri">△</text><text x="927.5" y="355" class="cellTri">△</text><text x="1102.5" y="355" class="cellO">O</text><text x="1277.5" y="355" class="cellO">O</text>

  <!-- row 6: 전류·온도 이상 확인 -->
  <text x="47" y="397" class="label">전류·온도 이상 확인</text>
  <text x="402.5" y="397" class="cellTri">△⁴</text><text x="577.5" y="397" class="cellTri">△⁴</text><text x="752.5" y="397" class="cellTri">△⁴</text><text x="927.5" y="397" class="cellTri">△⁴</text><text x="1102.5" y="397" class="cellO">O⁴</text><text x="1277.5" y="397" class="cellGoal">목표</text>

  <!-- row 7: 방문 설치·매핑 -->
  <text x="47" y="439" class="label">방문 설치·매핑</text>
  <text x="402.5" y="439" class="cellX">X</text><text x="577.5" y="439" class="cellX">X</text><text x="752.5" y="439" class="cellX">X</text><text x="927.5" y="439" class="cellX">X</text><text x="1102.5" y="439" class="cellTri">△</text><text x="1277.5" y="439" class="cellO">O</text>

  <!-- row 8: 연 1회 정기점검 -->
  <text x="47" y="481" class="label">연 1회 정기점검</text>
  <text x="402.5" y="481" class="cellX">X</text><text x="577.5" y="481" class="cellX">X</text><text x="752.5" y="481" class="cellX">X</text><text x="927.5" y="481" class="cellX">X</text><text x="1102.5" y="481" class="cellX">X</text><text x="1277.5" y="481" class="cellO">O</text>

  <!-- row 9: 자사 장비 교체관리 -->
  <text x="47" y="523" class="label">자사 장비 교체관리</text>
  <text x="402.5" y="523" class="cellTri">△⁵</text><text x="577.5" y="523" class="cellTri">△⁵</text><text x="752.5" y="523" class="cellTri">△⁵</text><text x="927.5" y="523" class="cellTri">△⁵</text><text x="1102.5" y="523" class="cellTri">△⁵</text><text x="1277.5" y="523" class="cellO">O</text>

  <!-- row 10: 전문 전기업체 연결 -->
  <text x="47" y="565" class="label">전문 전기업체 연결</text>
  <text x="402.5" y="565" class="cellX">X</text><text x="577.5" y="565" class="cellX">X</text><text x="752.5" y="565" class="cellX">X</text><text x="927.5" y="565" class="cellX">X</text><text x="1102.5" y="565" class="cellX">X</text><text x="1277.5" y="565" class="cellO">O</text>

  <text x="35" y="610" class="foot">¹ 헤이홈·Tapo·Aqara+Tapo·LG는 1구 스마트플러그 여러 개를 설치한 구성</text>
  <text x="35" y="630" class="foot">² LG는 별도 모션·조도센서 등을 추가해야 공간 상태를 자동화 조건으로 사용 가능</text>
  <text x="35" y="650" class="foot">³ 고객이 센서·플러그·플랫폼 자동화를 직접 구성해야 함</text>
  <text x="35" y="670" class="foot">⁴ 원자료가 "확인 필요/과부하 보호/과부하·과열 차단" 등 서술형이라 O/△로 환산(편집 판단)</text>
  <text x="35" y="690" class="foot">⁵ 사후 A/S는 제공하나 BIUM처럼 상태 기반 선제 교체판단은 제공하지 않음</text>
</svg>
