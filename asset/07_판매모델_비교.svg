<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F7CFF"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Malgun Gothic", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 800; fill: #102A43; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #52616F; }
      .h { font-size: 20px; font-weight: 800; fill: #102A43; }
      .b { font-size: 15px; font-weight: 600; fill: #263442; }
      .s { font-size: 13px; font-weight: 500; fill: #52616F; }
      .xs { font-size: 11px; font-weight: 500; fill: #52616F; }
      .num { font-size: 31px; font-weight: 900; fill: #102A43; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1200" height="570" rx="24" fill="#FFFFFF"/>
  <text x="46" y="55" class="title">고객 선택형 판매모델</text>
  <text x="46" y="83" class="subtitle">설치·관리 필요에 따라 셀프 설치형과 방문 관리형을 분리</text>
  
  <rect x="55" y="120" width="520" height="390" rx="24" fill="#E9EFFF" stroke="#4F7CFF" stroke-width="3" filter="url(#shadow)"/>
  <text x="95" y="170" class="num">셀프 설치형</text>
  <text x="95" y="205" class="b">BIUM 기본 패키지 · 249,000원 일시구매</text>
  <line x1="95" y1="230" x2="535" y2="230" stroke="#4F7CFF" stroke-width="2" opacity=".45"/>
  <circle cx="105" cy="270" r="6" fill="#4F7CFF"/><text x="125" y="276" class="b">전국 온라인 판매</text><circle cx="105" cy="318" r="6" fill="#4F7CFF"/><text x="125" y="324" class="b">고객 직접 설치·공간/기기 매핑</text><circle cx="105" cy="366" r="6" fill="#4F7CFF"/><text x="125" y="372" class="b">QR·설치영상·원격지원</text><circle cx="105" cy="414" r="6" fill="#4F7CFF"/><text x="125" y="420" class="b">기본 자동제어·기기 상태 확인</text><circle cx="105" cy="462" r="6" fill="#4F7CFF"/><text x="125" y="468" class="b">선택형 앱 구독 월 4,900원</text>

  <rect x="625" y="120" width="520" height="390" rx="24" fill="#E8F7F4" stroke="#0D9488" stroke-width="3" filter="url(#shadow)"/>
  <text x="665" y="170" class="num">방문 관리형</text>
  <text x="665" y="205" class="b">초기 49,000원 + 월 12,900원 × 48개월</text>
  <line x1="665" y1="230" x2="1105" y2="230" stroke="#0D9488" stroke-width="2" opacity=".45"/>
  <circle cx="675" cy="270" r="6" fill="#0D9488"/><text x="695" y="276" class="b">직영 또는 교육받은 지역 파트너</text><circle cx="675" cy="318" r="6" fill="#0D9488"/><text x="695" y="324" class="b">방문 설치·공간/기기 매핑</text><circle cx="675" cy="366" r="6" fill="#0D9488"/><text x="695" y="372" class="b">월간 리포트·원격지원</text><circle cx="675" cy="414" r="6" fill="#0D9488"/><text x="695" y="420" class="b">연 1회 예약점검·자사 장비 확인</text><circle cx="675" cy="462" r="6" fill="#0D9488"/><text x="695" y="468" class="b">48개월 후 장비 소유권 이전</text>
  
